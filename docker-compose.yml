version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: albany-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: albany_inventory
    ports:
      - "3307:3306"
    volumes:
      - albany_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: ./backend
    container_name: albany-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/albany_inventory?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-albanySistemaInventarioClaveSecretaCambiarEnProduccion2026}
      # Zona horaria de la tienda: define que cuenta como "ventas de hoy"
      TZ: America/Bogota
    ports:
      - "8081:8080"

  frontend:
    build: ./frontend
    container_name: albany-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  albany_mysql_data:
