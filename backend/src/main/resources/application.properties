spring.application.name=albany-inventory

# ---- Base de datos MySQL ----
# Valores por defecto para desarrollo local; en otros entornos se sobrescriben con
# las variables SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:mysql://localhost:3306/albany_inventory?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# No fallar de inmediato si la base de datos aun no esta lista (reintenta en segundo plano)
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=30000

# ---- Servidor ----
server.port=8080

# ---- JWT ----
# En produccion define la variable JWT_SECRET (minimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:albanySistemaInventarioClaveSecretaCambiarEnProduccion2026}
app.jwt.expiration-ms=86400000

# ---- CORS ---- (lista separada por comas)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
