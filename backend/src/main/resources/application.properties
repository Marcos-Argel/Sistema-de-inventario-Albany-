spring.application.name=albany-inventory

# ---- Base de datos MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/albany_inventory?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# No fallar de inmediato si la base de datos aun no esta lista (reintenta en segundo plano)
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=30000

# ---- Servidor ----
server.port=8080

# ---- JWT ----
app.jwt.secret=albanySistemaInventarioClaveSecretaCambiarEnProduccion2026
app.jwt.expiration-ms=86400000

# ---- CORS ----
app.cors.allowed-origins=http://localhost:5173
